name: Revision correctness tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            client
            configs
            docs
            models
            preprocess
            results
            scripts
            sp4cpg
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
